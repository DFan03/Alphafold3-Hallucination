# Generic Fixed-Target Protein Binder Hallucination Example
# Designs an 48-aa binder (chain B) against a fixed synthetic helical receptor (chain A)
name: protein_binder_fixed_target
target_seq: "MSELQKAIEELAKKAEELAKKLEELAKKAEELAKKLEELG"
binder_length: 48
steps: 100
proposals_per_step: 1
num_recycles: 3
num_diffusion_samples: 1
flash_attention: triton
backend: in_memory
T_init: 0.05
half_life: 50.0
temp_schedule: exp
mutation_rate: "3-1"
mutation_method: blosum
mask_mode: interface
interface_dist: 6.0
mask_refresh_interval: 10
p_nonint: 0.1
exclude_aa: "CP"
forbid_sequon: true
losses: "ipsae_min,iptm,plddt"
loss_weights: "1.5,1.0,0.5"
seed: 0
out_root: ./runs
tmp_root: ./tmp
