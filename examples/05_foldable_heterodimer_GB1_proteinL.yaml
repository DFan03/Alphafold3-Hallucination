# Foldable alpha/beta heterodimer start: A = protein G B1 domain (GB1, 56 aa, identical to PDB 1PGA), B = protein L B1 domain (64 aa, PDB 1HZ6
# residues after the His-tag, with two substitutions: N14D removes its NGS sequon, W47Y). Both are beta-hairpin + helix + beta-hairpin domains
# with a hydrophobic core; 0 Cys / 0 Pro / 0 sequon.
# AB+ only (no negative states). Equivalent shorthand:  af3-hall --oligo AB+ binder_seq="<seqA>,<seqB>" --losses dual --steps 100
# Results of this exact config: examples/05_foldable_heterodimer/README.md
name: foldable_heterodimer_gb1_proteinl
binder_seq: "MTYKLILNGKTLKGETTTEAVDAATAEKVFKQYANDNGVDGEWTYDDATKTFTVTE,MEEVTIKANLIFADGSTQTAEFKGTFEKATSEAYAYADTLKKDNGEYTVDVADKGYTLNIKFAG"
states:
  - name: AB_pos
    weight: 1.0
    chains:
      - type: protein
        id: A
        mutable: true
        protomer: A
      - type: protein
        id: B
        mutable: true
        protomer: B
steps: 100
proposals_per_step: 1
num_recycles: 1
num_diffusion_samples: 1
flash_attention: triton
backend: in_memory
T_init: 0.01
half_life: 1000.0
temp_schedule: exp
margin: 0.0
mutation_rate: "3-1"
mutation_method: frequency_adjusted
mask_mode: all
exclude_aa: "CP"
forbid_sequon: true
losses: "dual"
loss_weights: "1.0"
seed: 0
out_root: ./runs
tmp_root: ./tmp
