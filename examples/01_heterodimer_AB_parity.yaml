# Multistate De Novo Heterodimer Example on AlphaFold 3 (AB+, AA-, BB-)
# Equivalent shorthand CLI:
#   af3-hall --oligo AB+,AA-,BB- --L 50,50 --losses dual --steps 100
name: heterodimer_ab_parity
binder_length: "50,50"
states:
  - name: AB_pos
    weight: 1.0
    chains:
      - type: protein
        id: A
        mutable: true
        protomer: A
      - type: protein
        id: B
        mutable: true
        protomer: B
  - name: AA_neg
    weight: -0.5
    chains:
      - type: protein
        id: A
        mutable: true
        protomer: A
      - type: protein
        id: B
        mutable: true
        protomer: A
  - name: BB_neg
    weight: -0.5
    chains:
      - type: protein
        id: A
        mutable: true
        protomer: B
      - type: protein
        id: B
        mutable: true
        protomer: B
steps: 100
proposals_per_step: 1
num_recycles: 1
num_diffusion_samples: 1
flash_attention: triton
backend: in_memory
T_init: 0.01
half_life: 1000.0
temp_schedule: exp
margin: 0.0
mutation_rate: "3-1"
mutation_method: frequency_adjusted
mask_mode: all
exclude_aa: "CP"
forbid_sequon: true
losses: "dual"
loss_weights: "1.0"
lazy_neg_interval: 1
seed: 0
out_root: ./runs
tmp_root: ./tmp
