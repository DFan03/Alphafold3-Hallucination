name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest suite
        run: pytest -q tests/

      - name: Run CLI --help and CPU --mock smoke tests
        run: |
          af3-hall --help
          python AF3_multistate_hallucination.py --oligo AB+,AA-,BB- --L 12,12 --steps 3 --mock --out ./ci_smoke
          for cfg in examples/*.yaml; do
            echo "Running smoke test for $cfg"
            af3-hall --config "$cfg" --mock --steps 2 --out "./ci_smoke_ex/$(basename "$cfg" .yaml)"
          done
          rm -rf ./ci_smoke ./ci_smoke_ex
